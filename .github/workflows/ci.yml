name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { compiler: gcc, sanitizer: none }
          - { compiler: clang, sanitizer: none }
          - { compiler: clang, sanitizer: asan }
          - { compiler: clang, sanitizer: tsan }

    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang
      - name: Build and test
        run: ./build.sh --compiler ${{ matrix.compiler }} --sanitizer ${{ matrix.sanitizer }} --test

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Build and test
        shell: cmd
        run: build.bat --test
